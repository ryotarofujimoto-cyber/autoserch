name: Daily Property Scraper

on:
  schedule:
    - cron: '0 23 * * *'  # 毎朝 8:00 (JST) に自動実行
  workflow_dispatch:      # 手動実行ボタンを有効化

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのファイルを取得
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Python 3.11 の環境を準備
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. 必要なライブラリのインストール（最新の google-genai を指定）
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y google-generativeai google-genai
          pip install google-genai playwright requests gspread google-auth
          playwright install --with-deps chromium

      # 4. main.py の実行（Secretsの鍵を環境変数として渡す）
      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py
