name: Daily Property Scraper

# いつ実行するか（トリガー設定）
on:
  schedule:
    # UTC時刻表記（UTC 23:00 = 日本時間(JST)の毎朝8:00）
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHubの画面から手動で実行できるボタンを出す設定

jobs:
  run-scraper:
    runs-on: ubuntu-latest # クラウド上のLinux環境で実行

    steps:
      # 1. GitHub上のコード（main.pyなど）を取得
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Pythonのセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 必要なライブラリとPlaywrightブラウザのインストール
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests gspread google-auth google-generativeai
          playwright install --with-deps chromium

      # 4. main.py を実行（暗号化保存したSecretsをプログラムに渡す）
      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py
